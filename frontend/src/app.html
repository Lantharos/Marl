<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
		<script>
			try {
				var styPath = window.location.pathname;
				var styStandalone =
					styPath.indexOf('/auth/') === 0 ||
					styPath.indexOf('/verify/') === 0 ||
					styPath.indexOf('/oauth/') === 0 ||
					styPath === '/docs' ||
					styPath.indexOf('/docs/') === 0 ||
					styPath === '/pig' ||
					styPath.indexOf('/pig/') === 0 ||
					styPath === '/privacy' ||
					styPath === '/terms';
				var styHasAuth =
					localStorage.getItem('sty_token') || localStorage.getItem('sty_ave_session');
				if (styHasAuth && !styStandalone) {
					document.documentElement.setAttribute('data-sty-auth-check', 'pending');
				}
			} catch (_) {}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
