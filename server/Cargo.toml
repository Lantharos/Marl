[package]
name = "sty-worker"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
base64 = "0.22.1"
ed25519-dalek = { version = "2.2.0", features = ["serde"] }
futures-util = "0.3.32"
getrandom = { version = "0.2.17", features = ["js"] }
hex = "0.4.3"
hmac = "0.13.0"
js-sys = "0.3"
jsonwebtoken = { version = "10.3.0", default-features = false, features = ["rust_crypto"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.11.0"
sty-protocol = { path = "../crates/sty-protocol" }
uuid = { version = "1.23.1", features = ["v4", "js"] }
wasm-bindgen = "0.2"
worker = { version = "0.8.1", features = ["d1"] }
