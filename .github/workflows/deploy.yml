name: Deploy

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun ci
      - run: bunx wrangler d1 migrations apply marl --remote --config apps/api/wrangler.jsonc
      - run: bunx wrangler deploy --config apps/api/wrangler.jsonc
      - run: bunx wrangler deploy --config apps/git-edge/wrangler.jsonc
      - run: bun run --cwd apps/web deploy
      - run: bunx pult deploy
        working-directory: apps/api
        env:
          PULT_KEY: ${{ secrets.PULT_KEY }}
