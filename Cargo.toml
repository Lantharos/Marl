[workspace]
resolver = "3"
members = [
  "crates/sty-protocol",
  "crates/sty-store",
  "server/local",
  "client",
]
exclude = ["server/worker"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
anyhow = "1.0.102"
axum = "0.8.9"
base64 = "0.22.1"
clap = { version = "4.6.1", features = ["derive"] }
hex = "0.4.3"
reqwest = { version = "0.13.2", default-features = false, features = ["blocking", "form", "json", "rustls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.11.0"
tempfile = "3.27.0"
tokio = { version = "1.52.1", features = ["full"] }
sty-protocol = { path = "crates/sty-protocol" }
