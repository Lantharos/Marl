[workspace]
resolver = "3"
members = [
  "crates/repository",
  "crates/cli",
  "crates/git",
  "crates/runner",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"

[workspace.dependencies]
anyhow = "1.0.102"
clap = { version = "4.6.1", features = ["derive"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tempfile = "3.27.0"
thiserror = "2.0.18"
repository = { path = "crates/repository" }
axum = "0.8.9"
bytes = "1.11.1"
futures-util = "0.3.34"
glob = "0.3.4"
reqwest = { version = "0.13.2", default-features = false, features = ["json", "query", "rustls", "stream"] }
russh = "0.62.5"
rand = "0.10.2"
tokio = { version = "1.52.1", features = ["full"] }
tokio-util = { version = "0.7.18", features = ["io"] }
runner = { path = "crates/runner" }
