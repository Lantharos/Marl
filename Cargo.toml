[workspace]
resolver = "3"
members = [
  "crates/sty-core",
  "crates/sty-cli",
  "crates/sty-git",
  "crates/sty-runner",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"

[workspace.dependencies]
anyhow = "1.0.102"
clap = { version = "4.6.1", features = ["derive"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tempfile = "3.27.0"
thiserror = "2.0.18"
sty-core = { path = "crates/sty-core" }
axum = "0.8.9"
bytes = "1.11.1"
futures-util = "0.3.34"
reqwest = { version = "0.13.2", default-features = false, features = ["json", "query", "rustls", "stream"] }
tokio = { version = "1.52.1", features = ["full"] }
tokio-util = { version = "0.7.18", features = ["io"] }
sty-runner = { path = "crates/sty-runner" }
